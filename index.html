<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>먹방 디펜스 게임</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #121212; color: #fff; text-align: center; margin: 0; padding: 0; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
        
        /* 키오스크 화면 */
        #kiosk { padding: 15px 10px; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; box-sizing: border-box; }
        h1 { color: #ffeb3b; font-size: 22px; margin: 5px 0 10px 0; }
        .level-badge { background: #00e676; color: #121212; padding: 5px 15px; border-radius: 20px; font-size: 16px; font-weight: bold; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0, 230, 118, 0.3); }

        .menu-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: 100%; max-width: 360px; margin-bottom: 15px; }
        .menu-item { background: #2c2c2c; padding: 10px 5px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); width: 30%; min-width: 90px; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; }
        .menu-item .icon { font-size: 32px; margin-bottom: 5px; }
        .menu-item h3 { margin: 0 0 8px 0; font-size: 14px; color: #fff; }
        
        .qty-control { display: flex; align-items: center; justify-content: center; width: 100%; gap: 5px; }
        .btn { background: #ff5252; color: white; border: none; padding: 5px 12px; font-size: 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn:active { background: #ff1744; }
        .qty { font-size: 18px; font-weight: bold; width: 20px; color: #ffeb3b; text-align: center; }
        
        .btn-start { background: #00e676; padding: 15px; font-size: 18px; border-radius: 10px; border: none; font-weight: bold; color: #121212; cursor: pointer; width: 90%; max-width: 340px; box-shadow: 0 4px 10px rgba(0, 230, 118, 0.4); margin-top: 5px; }
        .btn-start:active { transform: scale(0.98); }
        
        /* 플레이어 및 오버레이 UI */
        #player { display: none; width: 100vw; height: 100vh; background: #000; position: relative; touch-action: none; /* 터치 제스처 중복 방지 */ }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        
        #ui-layer { position: absolute; top: 10px; left: 10px; text-align: left; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px; z-index: 10; backdrop-filter: blur(4px); transform: scale(0.9); transform-origin: top left; border: 1px solid #444; width: 250px; pointer-events: auto; }
        #ui-layer h2 { margin: 0 0 8px 0; color: #ffeb3b; font-size: 14px; border-bottom: 1px solid #555; padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        
        .btn-home { background: #ff5252; color: #fff; border: none; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; font-weight: bold; }
        .btn-home:active { background: #d50000; }
        
        .plate { font-size: 13px; margin-bottom: 6px; color: #ddd; transition: 0.3s; display: flex; align-items: center;}
        .active-plate { color: #fff; font-weight: bold; font-size: 15px; text-shadow: 0 0 5px #ffeb3b; transform: translateX(5px); }
        .dot-full { color: #ff5252; letter-spacing: 2px; font-size: 10px; margin-left: 8px;}
        .dot-empty { color: #555; letter-spacing: 2px; font-size: 10px; }
        
        /* 레벨업 팝업창 */
        #complete-msg { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); border: 2px solid #00e676; padding: 40px 20px; border-radius: 15px; z-index: 20; width: 80%; max-width: 320px; pointer-events: auto; }
        #complete-msg h2 { font-size: 26px; color: #ffeb3b; margin: 0 0 10px 0; }
        #complete-msg h3 { font-size: 22px; color: #00e676; margin: 0 0 25px 0; }

        /* 터치 하트 애니메이션 */
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }
        .floating-heart {
            position: absolute;
            font-size: 35px;
            pointer-events: none; /* 하트가 터치를 방해하지 않도록 설정 */
            animation: floatUp 0.8s ease-out forwards;
            z-index: 9999;
            filter: drop-shadow(0px 0px 5px rgba(255,0,0,0.5));
        }
    </style>
</head>
<body>

<div id="kiosk">
    <div class="level-badge">🏆 현재 레벨: Lv <span id="current-level">1</span></div>
    <h1>🍽️ 무한 먹방 퀘스트</h1>
    <div class="menu-container" id="menu-container"></div>
    <button class="btn-start" onclick="startMukbang()">먹방 시작하기 ▶</button>
</div>

<div id="player">
    <video id="vid1" playsinline></video>
    <video id="vid2" playsinline style="display:none;"></video>
    
    <div id="ui-layer"></div>
    
    <div id="complete-msg">
        <h2>🎉 전 메뉴 먹방 성공! 🎉</h2>
        <h3>LEVEL UP ➔ Lv <span id="new-level">2</span></h3>
        <button class="btn-start" onclick="location.reload()">다음 레벨 도전하기</button>
    </div>
</div>

<script>
    // 1. 접속 시 레벨 불러오기
    let playerLevel = localStorage.getItem('mukbangLevel');
    if (!playerLevel) {
        playerLevel = 1;
        localStorage.setItem('mukbangLevel', playerLevel);
    } else {
        playerLevel = parseInt(playerLevel);
    }
    document.getElementById('current-level').innerText = playerLevel;

    // 2. 파일명 세팅
    const foods = [
        { id: 'chicken', name: '치킨', file: 'chicken.mp4', qty: 0, icon: '🍗' },
        { id: 'pizza', name: '피자', file: 'pizza.mp4', qty: 0, icon: '🍕' },
        { id: 'ramen', name: '라면', file: 'ramen.mp4', qty: 0, icon: '🍜' },
        { id: 'tteokbokki', name: '떡볶이', file: 'tteokbokki.mp4', qty: 0, icon: '🥘' },
        { id: 'jjajang', name: '짜장면', file: 'jjajang.mp4', qty: 0, icon: '🍝' }
    ];

    let queue = [];
    let currentIdx = 0;
    let activeVideo = 1;
    let currentPlaybackRate = 1.0;

    const menuContainer = document.getElementById('menu-container');
    foods.forEach((food, idx) => {
        const div = document.createElement('div');
        div.className = 'menu-item';
        div.innerHTML = `
            <div class="icon">${food.icon}</div>
            <h3>${food.name}</h3>
            <div class="qty-control">
                <button class="btn" onclick="changeQty(${idx}, -1)">-</button>
                <span class="qty" id="qty-${idx}">0</span>
                <button class="btn" onclick="changeQty(${idx}, 1)">+</button>
            </div>
        `;
        menuContainer.appendChild(div);
    });

    function changeQty(idx, delta) {
        let newQty = foods[idx].qty + delta;
        if (newQty >= 0 && newQty <= 5) {
            foods[idx].qty = newQty;
            document.getElementById(`qty-${idx}`).innerText = newQty;
        }
    }

    function generateQueue() {
        queue = [];
        let remaining = foods.map(f => ({...f}));
        let active = remaining.filter(f => f.qty > 0);
        
        while(active.length > 0) {
            for (let i = 0; i < active.length; i++) {
                let food = active[i];
                if (food.qty > 0) {
                    let snapshot = active.map(f => ({ name: f.name, icon: f.icon, qty: f.qty }));
                    queue.push({ foodId: food.id, name: food.name, file: food.file, snapshot: snapshot });
                    food.qty--;
                }
            }
            active = active.filter(f => f.qty > 0);
        }
    }

    // 3. 듀얼 버퍼 선로딩(Pre-load) 시스템 적용
    function startMukbang() {
        generateQueue();
        if (queue.length === 0) {
            alert("음식을 최소 1개 이상 담아주세요!");
            return;
        }
        document.getElementById('kiosk').style.display = 'none';
        document.getElementById('player').style.display = 'block';
        
        currentIdx = 0;
        activeVideo = 1;
        
        const v1 = document.getElementById('vid1');
        const v2 = document.getElementById('vid2');
        
        // 첫 번째 영상 및 두 번째 영상 선로딩
        v1.src = queue[0].file;
        v1.load();
        if (queue.length > 1) {
            v2.src = queue[1].file;
            v2.load();
        }
        
        updateUI(queue[0].snapshot, queue[0].name);
        v1.style.display = 'block';
        v2.style.display = 'none';
        v1.playbackRate = currentPlaybackRate;
        v1.play();
    }

    // 영상 종료 이벤트 공통 바인딩
    document.getElementById('vid1').onended = playNext;
    document.getElementById('vid2').onended = playNext;

    function playNext() {
        currentIdx++;
        if (currentIdx >= queue.length) {
            // 게임 클리어
            playerLevel++;
            localStorage.setItem('mukbangLevel', playerLevel);
            document.getElementById('ui-layer').style.display = 'none';
            document.getElementById('new-level').innerText = playerLevel;
            document.getElementById('complete-msg').style.display = 'block';
            return;
        }

        const currentVid = activeVideo === 1 ? document.getElementById('vid1') : document.getElementById('vid2');
        
        // 비디오 교체
        activeVideo = activeVideo === 1 ? 2 : 1;
        const nextVid = activeVideo === 1 ? document.getElementById('vid1') : document.getElementById('vid2');
        
        updateUI(queue[currentIdx].snapshot, queue[currentIdx].name);
        
        currentVid.style.display = 'none';
        nextVid.style.display = 'block';
        nextVid.playbackRate = currentPlaybackRate;
        nextVid.play(); // 이미 이전 턴에서 선로딩 되어있음
        
        // 그 다음 영상을 위한 백그라운드 선로딩 작업
        let preloadIdx = currentIdx + 1;
        if (preloadIdx < queue.length) {
            currentVid.src = queue[preloadIdx].file;
            currentVid.load();
        }
    }

    function updateUI(snapshot, currentFoodName) {
        const ui = document.getElementById('ui-layer');
        ui.innerHTML = `
            <h2>
                <span>테이블 잔여 현황</span>
                <div style="display:flex; align-items:center;">
                    <span style="font-size:12px; color:#00e676; margin-right:8px;">Lv ${playerLevel}</span>
                    <button class="btn-home" onclick="goHome(event)">🏠 홈</button>
                </div>
            </h2>`;
        snapshot.forEach(f => {
            const isActive = f.name === currentFoodName ? 'active-plate' : '';
            const fullDots = '●'.repeat(f.qty);
            const emptyDots = '○'.repeat(5 - f.qty);
            ui.innerHTML += `<div class="plate ${isActive}">
                ${f.icon} ${f.name} &nbsp; 
                <span class="dot-full">${fullDots}</span><span class="dot-empty">${emptyDots}</span> 
            </div>`;
        });
    }

    function goHome(e) {
        e.stopPropagation(); // 하트 터치 이벤트 차단
        const currentVid = activeVideo === 1 ? document.getElementById('vid1') : document.getElementById('vid2');
        currentVid.pause(); // 일시정지
        
        if (confirm("홈으로 이동 하시겠습니까?\n현재 주문 내역은 초기화됩니다.")) {
            location.reload();
        } else {
            currentVid.play(); // 취소 시 다시 재생
        }
    }

    // 4. 하트 리워드 및 배속 시스템 (Gamification)
    let isPressing = false;
    let tapTimeout;
    const playerDiv = document.getElementById('player');

    function setPlaybackRate(rate) {
        currentPlaybackRate = rate;
        document.getElementById('vid1').playbackRate = rate;
        document.getElementById('vid2').playbackRate = rate;
    }

    function createHeart(x, y) {
        const heart = document.createElement('div');
        heart.innerHTML = '❤️';
        heart.className = 'floating-heart';
        heart.style.left = (x - 17) + 'px'; // 클릭 지점 중앙 정렬
        heart.style.top = (y - 17) + 'px';
        document.body.appendChild(heart);
        setTimeout(() => { heart.remove(); }, 800);
    }

    playerDiv.addEventListener('pointerdown', (e) => {
        // UI 버튼 클릭 시 터치 이벤트 무시
        if(e.target.closest('#ui-layer') || e.target.closest('#complete-msg')) return;

        isPressing = true;
        createHeart(e.clientX, e.clientY); // 하트 생성
        setPlaybackRate(2.0); // 터치 시 즉시 2배속 (연속 터치 방어용)
        
        clearTimeout(tapTimeout);
        tapTimeout = setTimeout(() => {
            if (isPressing) {
                setPlaybackRate(1.2); // 손을 떼지 않고 누르고 있으면 1.2배속
            } else {
                setPlaybackRate(1.0); // 터치가 멈추면 1.0배속 복귀
            }
        }, 300); // 0.3초 기준 탭 vs 홀드 판별
    });

    function handlePointerUp(e) {
        if(e.target.closest('#ui-layer') || e.target.closest('#complete-msg')) return;
        isPressing = false;
        // 홀드(1.2배속) 중이었다면 손을 뗄 때 즉시 원상복구
        if (currentPlaybackRate === 1.2) {
            setPlaybackRate(1.0);
        }
    }
    
    playerDiv.addEventListener('pointerup', handlePointerUp);
    playerDiv.addEventListener('pointercancel', handlePointerUp);

</script>
</body>
</html>
